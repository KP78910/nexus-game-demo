services:
  - type: web
    name: nexus-game-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m py_compile server.py database.py
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-game-demo-db
          property: connectionString
